name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate static site
        run: pnpm exec nuxt generate docs --extends ../layer
        env:
          GITHUB_PAGES: 'true'
          NITRO_PRESET: github_pages
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          NUXT_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      # The root redirect to the default locale is server-side, so ship a static one
      - name: Add root redirect
        run: |
          echo '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=en"><link rel="canonical" href="en">' > docs/.output/public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
